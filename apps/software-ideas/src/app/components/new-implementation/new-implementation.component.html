<div class="container d-flex align-self-stretch justify-content-center" style="margin-top:50px">

    <form (ngSubmit)="addImplementation(implementationForm)">

        <div class="col">
            <mat-form-field appearance="fill">
                <mat-label>Name</mat-label>
                <input matInput [formControl]="implementationForm.controls.name">
                <mat-error *ngIf="implementationForm.controls.name.hasError('required')">
                    Name is <strong>required</strong>
                </mat-error>
            </mat-form-field>
        </div>

        <div class="col">
            <mat-form-field appearance="fill">
                <mat-label>Description</mat-label>
                <textarea matInput [formControl]="implementationForm.controls.description"></textarea>
            </mat-form-field>
        </div>

        <div class="col">
            <mat-form-field appearance="fill">
                <mat-label>Categories</mat-label>
                <mat-select [formControl]="implementationForm.controls.categories" multiple>
                    <mat-option *ngFor="let category of categoryOptions" [value]="category">{{category.name}}</mat-option>
                </mat-select>
                <mat-error *ngIf="implementationForm.controls.categories.hasError('required')">
                    At least 1 category is <strong>required</strong>
                </mat-error>
            </mat-form-field>
        </div>

        <div class="col">
            <form (ngSubmit)="addCategory(categoryForm.value)">
                <mat-form-field appearance="fill">
                    <mat-label for="otherCategory">New Category</mat-label>
                    <input matInput [formControl]="categoryForm.controls.name">
                </mat-form-field>
                <button mat-mini-fab color="primary" type="submit" [disabled]="!categoryForm.controls.name.value">
                    <mat-icon>add</mat-icon>
                </button>
            </form>
        </div>

        <div class="col">
            <mat-checkbox [formControl]="implementationForm.controls.isOwner">Claim Ownership</mat-checkbox>
        </div>

        <div class="col">
            <button mat-flat-button color="primary" type="submit">Submit</button>
        </div>
    </form>
</div>
