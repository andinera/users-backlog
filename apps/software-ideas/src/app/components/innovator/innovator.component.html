<mat-tab-group>
    <mat-tab label="Ideas">
        <mat-nav-list>
            <a mat-list-item *ngFor="let idea of innovator.ideas" routerLink="/Idea/{{idea.summary}}">
                {{idea.summary}}
            </a>
        </mat-nav-list>
    </mat-tab>
    <mat-tab label="implementations">
        <mat-nav-list>
            <a mat-list-item *ngFor="let implementation of innovator.implementations" routerLink="/Implementation/{{implementation.name}}">
                {{implementation.name}}
            </a>
        </mat-nav-list>
    </mat-tab>
</mat-tab-group>
