<mat-card *ngFor="let cOfI of categoriesOfIdeas">
    <mat-card-header routerLink="/category/{{cOfI.category.name}}">
        <mat-card-title>
            {{cOfI.category.name}}
        </mat-card-title>
    </mat-card-header>
    <mat-card-content *ngFor="let idea of cOfI.ideas" routerLink="/idea/{{idea.summary}}">
        {{idea.summary}}
    </mat-card-content>
</mat-card>
