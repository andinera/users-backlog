<mat-tab-group [animationDuration]="0" [selectedIndex]="selectedIndex" (selectedTabChange)="onSelectedTabChange($event)">

    <mat-tab [label]="tabLabels[0]">
        <p>
            {{idea.description}}
        </p>
    </mat-tab>

    <mat-tab [label]="tabLabels[1]">
        <mat-nav-list>
            <a mat-list-item *ngFor="let implementation of idea.implementations" routerLink="/Implementation/{{implementation.name}}">
                {{implementation.name}}
            </a>
        </mat-nav-list>
        <mat-accordion>
            <mat-expansion-panel [disabled]="!(authenticationService.innovator | async)">
                <mat-expansion-panel-header>
                    <mat-panel-title>
                        New Implementation
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <app-new-implementation [idea]="idea"></app-new-implementation>
            </mat-expansion-panel>
        </mat-accordion>
    </mat-tab>

    <mat-tab [label]="tabLabels[2]">
        <mat-nav-list>
            <a mat-list-item routerLink="/Innovator/{{idea.innovator.emailAddress}}">{{idea.innovator.emailAddress}}</a>
        </mat-nav-list>
    </mat-tab>

    <mat-tab [label]="tabLabels[3]">

    </mat-tab>

</mat-tab-group>
