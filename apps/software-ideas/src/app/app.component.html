<header class="header-5">

    <div class="branding">
        <a class="nav-link" routerLink="/ideas">
            <clr-icon shape="vm-bug"></clr-icon>
            <span class="title">Software Ideas</span>
        </a>
    </div>

    <!-- <div class="search">
        <label for="search_input">
            <input id="search_input" type="text" placeholder="Search for keywords...">
        </label>
    </div> -->

    <div class="header-actions">
        <a class="nav-link nav-text" routerLink="/addIdea">New Idea</a>
        <clr-dropdown>
            <button class="nav-text" clrDropdownTrigger aria-label="toggle settings menu">
                Hello, {{userName}}
                <clr-icon shape="caret down"></clr-icon>
            </button>
            <clr-dropdown-menu *clrIfOpen clrPosition="bottom-right">
                <a clrDropdownItem routerLink="/about">About</a>
                <a clrDropdownItem routerLink="/preferences">Preferences</a>
                <a *ngIf="!loggedIn" clrDropdownItem routerLink="/login">Login</a>
                <a *ngIf="loggedIn" clrDropdownItem (click)="logOut()">Logout</a>
            </clr-dropdown-menu>
        </clr-dropdown>
    </div>

</header>
<router-outlet></router-outlet>
