<div class="container d-flex align-self-stretch justify-content-center" style="margin-top:50px">

    <form (ngSubmit)="login(loginForm.value)">

        <div class="col" style="margin-bottom:30px">
            <button class="btn google-signin-button" type="button" (click)="openGoogleAuthenticator()">
                <img src="assets/512px-Google__G__Logo.svg.webp" width="15" height="15">
                Sign in with Google
            </button>
        </div>

        <div class="col">
            <mat-form-field appearance="fill">
                <mat-label>Email Address</mat-label>
                <input matInput type="email" [formControl]="loginForm.controls.emailAddress">
                <mat-error *ngIf="loginForm.controls.emailAddress.hasError('email') && !loginForm.controls.emailAddress.hasError('requred')">
                    Please enter a valid email address
                </mat-error>
                <mat-error *ngIf="loginForm.controls.emailAddress.hasError('required')">
                    Email is <strong>required</strong>
                </mat-error>
            </mat-form-field>
        </div>

        <div class="col">
            <mat-form-field appearance="fill">
                <mat-label>Password</mat-label>
                <input matInput type="password" [formControl]="loginForm.controls.password">
                <mat-error *ngIf="loginForm.controls.password.hasError('required')">
                    Password is <strong>required</strong>
                </mat-error>
            </mat-form-field>
        </div>

        <div class="col">
            <button class="btn btn-primary" type="submit" [disabled]="loggingIn">
                Login
                <mat-progress-bar *ngIf="loggingIn" mode="indeterminate"></mat-progress-bar>
            </button>
        </div>
        <div class="col">
            <button class="btn btn-light" type="button" (click)="createAccount(loginForm.value)" [disabled]="loggingIn">
                Create Account
                <mat-progress-bar *ngIf="loggingIn" mode="indeterminate"></mat-progress-bar>
            </button>
        </div>

    </form>
</div>
